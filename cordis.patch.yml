
- insert:
    - id: docker-sandbox
      name: dsh-docker-sandbox
      config:

        image: node:22

        resourceLimits:
          cpu: "2"
          memory: 4g
          memorySwap: 4g

        timeoutMs: 60000

        idleTtlMs: 3600000

        gcOnUnload: true

    - id: docker-sandbox-host-restore
      name: dsh-docker-sandbox/host-restore

- id: pwsh-sandbox
  disabled: true

- id: subprocess
  disabled: true

- id: fs-sandbox
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-bash
  disabled: false

